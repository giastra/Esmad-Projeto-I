<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/Contatos.css">
    <link rel="stylesheet" href="../css/Acessibilidade.css">
</head>
<body>

    <!--NAVBAR-->
    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" class="logo-link">
                <img src="../images/logo principal.png" alt="STAD TO DO">
                <span class="logo-text">STAD TO DO</span>
            </a>
        </div>

        <ul class="nav-links">
            <li><a href="../html/Sobre_nós.html" class="link">Sobre nós</a></li>
            <li><a href="../html/Contatos.html" class="link active">Contactos</a></li>
            <li><a href="#" class="btn btn-login">LOGIN</a></li>
            <li><a href="#" class="btn btn-registo">REGISTO</a></li>
        </ul>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!--FORM CONTACTAR-->
    <main>
        <div class="contact-form">
            <h2>Contacta-nos</h2>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="O teu nome">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="O teu email">

            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" placeholder="Assunto da mensagem">

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" placeholder="Escreve a tua mensagem"></textarea>

            <p class="info-email">A resposta será enviada por email</p>

            <button class="btn-enviar">Enviar Mensagem</button>
        </div>
    </main>

    <!-- BOTÃO DE ACESSIBILIDADE -->
    <div class="acessibilidade-btn">
        <img src="../images/Icone-acessibilidade.png" alt="Acessibilidade">
    </div>

    <!-- OVERLAY DO MODO TDAH -->
    <div class="tdha-rect-overlay"></div>

    <!--FOOTER-->
    <footer class="footer">
        <div class="footer-left">
            <span>© 2026 GRUPO 2</span>
        </div>

        <div class="footer-center">
            <a href="Sobre_nós.html">SOBRE NÓS</a>
            <a href="https://www.esmad.ipp.pt/">ESMAD</a>
            <a href="https://www.esmad.ipp.pt/cursos/licenciatura/663">CURSO</a>
            <a href="Contatos.html">CONTACTOS</a>
        </div>

        <div class="footer-right">
            <img src="../images/logo fother.png" alt="Logotipo preto">
        </div>
    </footer>

    <script src="../js/view/contactosView.js"></script>
    <script type="module" src="../js/view/indexView.js"></script>
    <script type="module" src="js/controller/authController.js"></script>
    <script src="../js/view/Acessibilidade.js"></script>
</body>
</html>
