<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/Perfil.css">
    <link rel="stylesheet" href="../css/Geral.css">
    <link rel="stylesheet" href="../css/Acessibilidade.css">
    <link rel="stylesheet" href="../css/Pomodoro.css">
</head>
<body>
    <!--NAVBAR-->
    <nav class="navbar">
      <div class="logo">
           <a class="logo-link">
             <img src="../images/logo principal.png" alt="STAD TO DO">
            <span class="logo-text">STAD TO DO</span>
           </a>
       </div>
  
      <ul class="nav-links">
          <li><a href="Home.html" class="link">Início</a></li>
          <li><a href="Categorias.html" class="link">Categorias</a></li>
          <li><a href="Tarefas.html" class="link">Tarefas</a></li>
          <li><a href="Calendário.html" class="link">Calendário</a></li>
          <li><a href="Diário.html" class="link">Diário</a></li>
          <li><a id="btn-pomodoro" class="link">Pomodoro</a></li>
          <li><a href="Perfil.html" class="link active">Perfil</a></li>
      </ul>

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

    <!-- BOTÃO DE ACESSIBILIDADE -->
    <div class="acessibilidade-btn">
        <img src="../images/Icone-acessibilidade.png" alt="Acessibilidade">
    </div>

    <!-- OVERLAY DO MODO TDAH -->
    <div class="tdha-rect-overlay"></div>

    <!-- MENSAGENS GLOBAIS -->
    <p id="erro" style="color:red;"></p>
    <p id="sucesso" style="color:green;"></p>

    <!-- DADOS DO UTILIZADOR -->
    <section id="info">
       <h2>O meu perfil</h2>
       <p>Nome: <span id="nome"></span></p>
       <p>Email: <span id="email"></span></p>

       <div class="perfil-buttons">
          <button id="btn-logout">Logout</button>
          <button id="btn-admin">Modo Admin</button>
       </div>
    </section>


    <!-- ATUALIZAR NOME -->
    <section>
        <h3>Atualizar Nome</h3>
        <form id="form-update">
            <label for="novo-nome">Novo nome</label>
            <!-- placeholder preenchido dinamicamente pelo carregarPerfil() -->
            <input type="text" id="novo-nome" placeholder="A carregar...">
            <button type="submit">Guardar</button>
        </form>
    </section>

    <!-- ATUALIZAR EMAIL -->
    <section>
        <h3>Atualizar Email</h3>
        <form id="form-email">
            <label for="novo-email">Novo email</label>
            <!-- placeholder preenchido dinamicamente pelo carregarPerfil() -->
            <input type="email" id="novo-email" placeholder="A carregar...">
            <label for="password-confirm">Password atual (confirmação)</label>
            <input type="password" id="password-confirm" placeholder="A tua password atual">
            <button type="submit">Guardar</button>
        </form>
    </section>

    <!-- ATUALIZAR PASSWORD -->
    <section>
        <h3>Atualizar Password</h3>
        <form id="form-password">
            <label for="password-atual">Password atual</label>
            <input type="password" id="password-atual" placeholder="Password atual">
            <label for="password-nova">Nova password</label>
            <input type="password" id="password-nova" placeholder="Nova password">
            <button type="submit">Guardar</button>
        </form>
    </section>

    <!-- ELIMINAR CONTA -->
    <section>
        <h3>Eliminar Conta</h3>
        <button id="btn-delete">Eliminar conta</button>
    </section>

    <!--FOOTER-->
    <footer class="footer">
        <div class="footer-left">
            <span>© 2026 GRUPO 2</span>
        </div>

        <div class="footer-center">
            <a href="Sobre_nós.html">SOBRE NÓS</a>
            <a href="https://www.esmad.ipp.pt/">ESMAD</a>
            <a href="https://www.esmad.ipp.pt/cursos/licenciatura/663">CURSO</a>
            <a href="Contatos.html">CONTACTOS</a>
        </div>

        <div class="footer-right">
          <img src="../images/logo fother.png" alt="Logotipo preto">
        </div>
    </footer>

    <script type="module" src="../js/controller/authController.js"></script>
    <script type="module" src="../js/view/pomodoroView.js"></script>
    <script src="../js/view/Acessibilidade.js"></script>
</body>
</html>
