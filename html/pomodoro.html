    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/Diário.css">
    <link rel="stylesheet" href="../css/Geral.css">
    <link rel="stylesheet" href="../css/Acessibilidade.css">
    <link rel="stylesheet" href="../css/Pomodoro.css">
</head>
<body>

    <!--NAVBAR-->
    <nav class="navbar">
      <div class="logo">
           <a class="logo-link">
             <img src="../images/logo principal.png" alt="STAD TO DO">
            <span class="logo-text">STAD TO DO</span>
           </a>
       </div>
      <ul class="nav-links">
          <li><a href="Home.html" class="link">Início</a></li>
          <li><a href="Categorias.html" class="link">Categorias</a></li>
          <li><a href="Tarefas.html" class="link">Tarefas</a></li>
          <li><a href="Calendário.html" class="link">Calendário</a></li>
          <li><a href="Diário.html" class="link">Diário</a></li>
          <li><a href="Pomodoro.html" class="link active">Pomodoro</a></li>
          <li><a href="Perfil.html" class="link">Perfil</a></li>
      </ul>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

    <!-- BOTÃO DE ACESSIBILIDADE -->
    <div class="acessibilidade-btn">
        <img src="../images/Icone-acessibilidade.png" alt="Acessibilidade">
    </div>

    <!-- OVERLAY DO MODO TDAH -->
    <div class="tdha-rect-overlay"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container my-4">

        <div id="mensagem"></div>

        <!-- TIMER — destaque no centro -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-6 text-center">
                <div class="pomodoro-container">
                    <h3 id="pomo-label">Foco</h3>
                    <div id="pomo-time">00:00</div>
                    <div id="pomo-ciclos"></div>
                    <div class="pomo-buttons mt-3">
                        <button id="pomo-start" class="btn btn-primary">Iniciar</button>
                        <button id="pomo-reset" class="btn btn-secondary">Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <hr>

        <!-- CRIAR + LISTA lado a lado -->
        <div class="row mt-4 g-4">

            <!-- CRIAR POMODORO -->
            <div class="col-md-5">
                <h2>Criar Pomodoro</h2>
                <form id="form-pomodoro">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="focusTime" class="form-label">Foco (min)</label>
                        <input type="number" class="form-control" id="focusTime" value="25" min="1" max="120" required>
                    </div>
                    <div class="mb-3">
                        <label for="shortBreak" class="form-label">Pausa curta (min)</label>
                        <input type="number" class="form-control" id="shortBreak" value="5" min="1" max="60" required>
                    </div>
                    <div class="mb-3">
                        <label for="longBreak" class="form-label">Pausa longa (min)</label>
                        <input type="number" class="form-control" id="longBreak" value="15" min="1" max="60" required>
                    </div>
                    <div class="mb-3">
                        <label for="cycles" class="form-label">Ciclos</label>
                        <input type="number" class="form-control" id="cycles" value="4" min="1" max="20" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Criar</button>
                </form>
            </div>

            <!-- OS MEUS POMODOROS -->
            <div class="col-md-7">
                <h2>Os meus Pomodoros</h2>
                <div id="lista-pomodoros">A carregar...</div>
            </div>

        </div>

    </main>

    <!-- MODAL EDIÇÃO -->
    <div class="modal fade" id="modal-edicao" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Pomodoro</h5>
                    <button type="button" class="btn-close" id="btn-fechar-modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-edicao">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3">
                            <label for="edit-name" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="edit-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-focusTime" class="form-label">Foco (min)</label>
                            <input type="number" class="form-control" id="edit-focusTime" min="1" max="120" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-shortBreak" class="form-label">Pausa curta (min)</label>
                            <input type="number" class="form-control" id="edit-shortBreak" min="1" max="60" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-longBreak" class="form-label">Pausa longa (min)</label>
                            <input type="number" class="form-control" id="edit-longBreak" min="1" max="60" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-cycles" class="form-label">Ciclos</label>
                            <input type="number" class="form-control" id="edit-cycles" min="1" max="20" required>
                        </div>
                        <div class="modal-footer px-0">
                            <button type="button" class="btn btn-secondary" id="btn-cancelar-modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!--FOOTER-->
    <footer class="footer">
        <div class="footer-left">
            <span>© 2026 GRUPO 2</span>
        </div>
        <div class="footer-center">
            <a href="Sobre_nós.html">SOBRE NÓS</a>

            <a href="https://www.esmad.ipp.pt/cursos/licenciatura/663">CURSO</a>
            <a href="Contatos.html">CONTACTOS</a>
        </div>
        <div class="footer-right">
          <img src="../images/logo fother.png" alt="Logotipo preto">
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/view/pomodoroView.js"></script>
    <script src="../js/view/Acessibilidade.js"></script>
</body>
</html>
