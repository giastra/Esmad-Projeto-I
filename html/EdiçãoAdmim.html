    <!-- CSS -->
    <link rel="stylesheet" href="../css/EdiçãoAdmim.css">
</head>
<body>

    <!-- NAVBAR ADMIN -->
    <nav class="navbar navbar-admin">
        <div class="logo">
            <a class="logo-link">
                <img src="../images/logo principal.png" alt="STAD TO DO">
                <span class="logo-text">STAD TO DO</span>
                <span class="admin-text">Administrador</span>
            </a>
        </div>

        <ul class="nav-links">
            <li><a href="Admim-Contactos.html" class="link">Contactos</a></li>

            <span></span>

        </div>

<main class="admin-colors-container">

    <section class="admin-header">
        <h1>Gestão de Cores</h1>
        <p>Adiciona e remove cores que serão usadas em todo o site.</p>
    </section>

    <!-- FORMULÁRIO -->
    <section class="color-form-section">
        <form id="form-color" class="color-form">

            <div class="form-group">
                <label for="name">Nome da Cor</label>
                <input type="text" id="name" placeholder="Ex: Roxo Primário" required>
            </div>

            <div class="form-group">
                <label for="hex">Código HEX</label>
                <input type="color" id="hex" value="#000000">
            </div>

            <button type="submit" class="btn-add-color">Adicionar Cor</button>
        </form>
    </section>

    <!-- LISTA DE CORES -->
    <section class="color-list-section">
        <h2>Cores Existentes</h2>
        <div id="colorList" class="color-list"></div>
    </section>

</main>


    <!-- FOOTER -->
    <footer class="footer">
