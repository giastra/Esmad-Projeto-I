<!DOCTYPE html>

<head>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Tarefas.css">
    <link rel="stylesheet" href="../css/Geral.css">
    <link rel="stylesheet" href="../css/Acessibilidade.css">
</head>

<body>

    <!--NAVBAR-->

    <nav class="navbar">
        <div class="logo">
            <a class="logo-link">
                <img src="../images/logo principal.png" alt="STAD TO DO">
                <span class="logo-text">STAD TO DO</span>
            </a>
        </div>

        <ul class="nav-links">
            <li><a href="Home.html" class="link">Início</a></li>
            <li><a href="Categorias.html" class="link">Categorias</a></li>
            <li><a href="Tarefas.html" class="link active">Tarefas</a></li>
            <li><a href="Calendário.html" class="link">Calendário</a></li>
            <li><a href="Diário.html" class="link">Diário</a></li>
            <li><a id="btn-pomodoro" class="link">Pomodoro</a></li>
            <li><a href="Perfil.html" class="link">Perfil</a></li>
        </ul>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!--MAIN-->

    <main>

        <section class="hero-sobre">
            <h1>Próximas Tarefas</h1>
        </section>

        <div class="filtros">
            <button class="btn-filtro" data-filter="todas">Todas</button>
            <button class="btn-filtro" data-filter="hoje">Hoje</button>
            <button class="btn-filtro" data-filter="semana">Esta Semana</button>
            <button class="btn-filtro" data-filter="prioridade">Prioridade</button>

            <div class="acoes">
                <button class="btn-add">+ Adicionar</button>
                <button class="btn-delete">
                    <img src="../images/Trash.png" alt="Apagar">
                </button>
            </div>
        </div>

        <div class="tarefas-container">
            <div class="coluna">
                <div class="lista-tarefas">
                    <div class="lista-header header-progresso">
                        <h3>Por Fazer</h3>
                    </div>
                    <div id="por-fazer" class="lista-conteudo"></div>
                </div>
            </div>

            <div class="coluna">
                <div class="lista-tarefas">
                    <div class="lista-header header-concluido">
                        <h3>Concluído</h3>
                    </div>
                    <div id="concluido" class="lista-conteudo"></div>
                </div>
            </div>
        </div>

    </main>

    
    <!-- BOTÃO DE ACESSIBILIDADE -->
    <div class="acessibilidade-btn">
        <img src="../images/Icone-acessibilidade.png" alt="Acessibilidade">
    </div>

    <!-- OVERLAY DO MODO TDAH -->
    <div class="tdha-rect-overlay"></div>

    <!--FOOTER-->

    <footer class="footer">
        <div class="footer-left">
            <span>© 2026 GRUPO 2</span>
        </div>

        <div class="footer-center">
            <a href="Sobre_nós.html">SOBRE NÓS</a>
            <a href="https://www.esmad.ipp.pt/">ESMAD</a>
            <a href="https://www.esmad.ipp.pt/cursos/licenciatura/663">CURSO</a>
            <a href="Contatos.html">CONTACTOS</a>
        </div>

        <div class="footer-right">
            <img src="../images/logo fother.png" alt="Logotipo preto">
        </div>

    <script src="../js/view/tarefasView.js"></script>
